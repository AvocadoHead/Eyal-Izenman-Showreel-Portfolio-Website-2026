{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene(),box=(x,y,z,w,h,c,k)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:C(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m);};

const DECO=[[-2.7,-27,0,1,1.7,.55,0,.36,0],[2.7,-42,0,1,1.5,.7,1.3,.3,1],[-2.8,-59,0,1,1.8,.5,2.2,.42,2],[2.6,-74,0,1,1.4,.62,.4,.33,3],[-2.6,-91,0,1,1.6,.58,3.1,.3,1],[2.8,-106,0,1,1.7,.5,1.9,.38,0],

  for(let i=0;i<DECO.length;i++){const d=DECO[i],r=d[7]*k;let ang;
    if(d[4]<0){const th=d[6]+d[5]*t;dP.set(d[0]+d[2]*Math.sin(th),r,d[1]-d[2]*Math.cos(th));dA.set(Math.sin(th),0,-Math.cos(th));ang=d[2]*d[5]*t/d[7];}
